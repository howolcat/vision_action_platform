{% extends "base.html" %}
{% block title %}로그인 · Vision Action Platform{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>로그인</h1>
  <p class="muted">로그인하면 영상 업로드 또는 IP Webcam으로 동작 분석을 요청할 수 있어요.</p>

  {% if form.non_field_errors %}
    <div class="alert alert-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  {% endif %}

  <form method="post" class="form">
    {% csrf_token %}
    <label class="field">
      <span>아이디</span>
      <input type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>비밀번호</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>
  <p class="auth-switch">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
